packages:
  - packages/*
  - services/*

catalog:
  '@types/node': ^24
  date-fns: ^4.1.0
  http-status-codes: ^2.3.0
  ofetch: ^2.0.0-alpha.3
  pino: ^10.3.1

catalogs:
  dev:
    typescript: ^7.0.2
    tsx: ^4.21.0
    pino-pretty: ^13.1.3
  test:
    vitest: ^5.0.0
    '@vitest/coverage-v8': ^5.0.0
    vitest-mock-extended: ^5.1.1
    msw: ^2.15.0
  build:
    json5: ^2.2.3
    tsdown: ^0.23.0

injectWorkspacePackages: true

allowBuilds:
  '@prisma/engines': true
  lefthook: true

  esbuild: false
  msw: false
  prisma: false

minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - '@ezpaarse-project/oxlint-config'
