packages:
  - packages/*
  - services/*

catalog:
  # deps
  typescript: ^7.0.2
  tsx: ^4.21.0
  # dev deps
  '@types/node': ^24
  pino-pretty: ^13.1.3
  # test deps
  vitest: ^4.1.6
  '@vitest/coverage-v8': ^4.1.6
  vitest-mock-extended: ^4.0.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: false
  lefthook: true
  msw: false
  prisma: false

injectWorkspacePackages: true

minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - '@ezpaarse-project/oxlint-config'
