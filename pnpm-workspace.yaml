packages:
  - packages/*
  - services/*

catalog:
  '@types/node': ^26
  date-fns: ^4.1.0
  http-status-codes: ^2.3.0
  ofetch: ^2.0.0-alpha.3
  pino: ^10.3.1
  stream-chain: ^4.2.6
  stream-json: ^3.7.0

catalogs:
  dev:
    typescript: ^7.0.2
    tsx: ^4.21.0
    pino-pretty: ^13.1.3
  test:
    vitest: ^5.0.0
    '@vitest/coverage-v8': ^5.0.0
    vitest-mock-extended: ^5.1.1
    msw: ^2.15.0
  build:
    json5: ^2.2.3
    tsdown: ^0.23.0

injectWorkspacePackages: true

permissions:
  '@unhead/vue':
    skills: false
  '@prisma/engines':
    build: true
  lefthook:
    build: true
  esbuild:
    build: false
  msw:
    build: false
  prisma:
    build: false

minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - '@ezpaarse-project/oxlint-config'
