include:
  - compose.yml

services:
  postgres:
    ports:
      - 5432:5432

  api:
    build:
      target: pnpm
    working_dir: /usr/dev/services/api
    command: pnpm run dev
    ports:
      - 8080:8080
      - 9230:9229 # Debugger port
    develop:
      watch:
        - action: sync
          path: ./packages
          target: /usr/dev/packages
          initial_sync: true
        - action: sync
          path: ./services/api/src
          target: /usr/dev/services/api/src
          initial_sync: true
        - action: rebuild
          path: ./services/api/package.json

  enricher:
    build:
      target: pnpm
    working_dir: /usr/dev/services/enricher
    command: pnpm run dev
    ports:
      - 8081:8080
      - 9231:9229 # Debugger port
    develop:
      watch:
        - action: sync
          path: ./packages
          target: /usr/dev/packages
          initial_sync: true
        - action: sync
          path: ./services/enricher/src
          target: /usr/dev/services/enricher/src
          initial_sync: true
        - action: rebuild
          path: ./services/enricher/package.json

  harvester:
    build:
      target: pnpm
    working_dir: /usr/dev/services/harvester
    command: pnpm run dev
    ports:
      - 8082:8080
      - 9232:9229 # Debugger port
    develop:
      watch:
        - action: sync
          path: ./packages
          target: /usr/dev/packages
          initial_sync: true
        - action: sync
          path: ./services/harvester/src
          target: /usr/dev/services/harvester/src
          initial_sync: true
        - action: rebuild
          path: ./services/harvester/package.json
